<script>
(() => {
  const STORAGE_KEY = "stock_scanner_preferences_v2";
  const LEGACY_WATCHLIST_KEY = "stock_scanner_watchlist_v1";
  let lastRender = "";

  const storage = (() => {
    try {
      const parentStorage = window.parent.localStorage;
      parentStorage.getItem(STORAGE_KEY);
      return parentStorage;
    } catch (_) {
      return window.localStorage;
    }
  })();

  const send = (type, extra = {}) => window.parent.postMessage({
    isStreamlitMessage: true,
    type,
    ...extra
  }, "*");

  const returnValue = (value) => {
    send("streamlit:setComponentValue", { value });
    send("streamlit:setFrameHeight", { height: 0 });
  };

  const readPreferences = () => {
    try {
      const parsed = JSON.parse(storage.getItem(STORAGE_KEY) || "{}");
      if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) {
        if (!parsed.symbols) {
          parsed.symbols = storage.getItem(LEGACY_WATCHLIST_KEY) || "";
        }
        return parsed;
      }
    } catch (_) {}
    return { symbols: storage.getItem(LEGACY_WATCHLIST_KEY) || "" };
  };

  window.addEventListener("message", event => {
    if (event.data?.type !== "streamlit:render") return;
    const action = event.data.args?.action || "read";
    const incoming = event.data.args?.preferences || {};
    const signature = `${action}:${JSON.stringify(incoming)}`;
    if (signature === lastRender) return;
    lastRender = signature;

    try {
      if (action === "write" && incoming && typeof incoming === "object") {
        storage.setItem(STORAGE_KEY, JSON.stringify(incoming));
        if (incoming.symbols) {
          storage.setItem(LEGACY_WATCHLIST_KEY, String(incoming.symbols));
        }
      }
      returnValue(readPreferences());
    } catch (_) {
      returnValue(incoming);
    }
  });

  send("streamlit:componentReady", { apiVersion: 1 });
  send("streamlit:setFrameHeight", { height: 0 });
})();
</script>
